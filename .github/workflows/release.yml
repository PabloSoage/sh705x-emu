# On a version tag (v0.1.0, ...): builds the Windows programs, checks that they carry their
# C runtime (.cargo/config.toml), and puts them on a draft release of that tag. The signed
# Android APKs are added to the draft by hand before publishing it. Run by hand instead
# (workflow_dispatch), it builds and checks the same and keeps the zip as the run's artifact.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p gui -p sh705x
      - name: Check they need no Visual C++ runtime
        shell: pwsh
        run: |
          foreach ($exe in 'target/release/sh705x-gui.exe', 'target/release/sh705x.exe') {
            if (Select-String -Path $exe -Pattern 'VCRUNTIME140.dll' -SimpleMatch -Quiet) {
              throw "$exe imports VCRUNTIME140.dll: the C runtime is not linked in"
            }
          }
      - name: Package
        shell: pwsh
        run: |
          $name = "sh705x-${{ github.ref_name }}-windows-x86_64" -replace '/', '-'
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/sh705x-gui.exe, target/release/sh705x.exe, LICENSE, README.md $name
          Compress-Archive $name "$name.zip"
      - name: Keep the zip (run by hand)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: ./*.zip
      - name: Draft release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" ./*.zip --clobber
          else
            gh release create "$tag" ./*.zip --draft --title "$tag" --generate-notes
          fi
