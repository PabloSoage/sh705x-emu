[package]
name = "gui"
description = "Graphical front end of the SH705x ECU emulator: CPU, code, memory, CAN and sensor inputs, live"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
authors.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sh705x-gui"
path = "src/main.rs"

[dependencies]
sh2e.workspace = true
sh7059.workspace = true
board.workspace = true
bridge.workspace = true
engine.workspace = true
session.workspace = true
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }

# On Linux winit needs a windowing backend; both load their libraries at run time.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["x11", "wayland"] }

[lints]
workspace = true

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
